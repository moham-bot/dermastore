<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldMark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="markDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#047857" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#markGrad)" filter="url(#markDrop)"/>
  <!-- Gold Halo Ring -->
  <circle cx="24" cy="24" r="14" fill="none" stroke="url(#goldMark)" stroke-width="1.2" stroke-dasharray="2 2.5" opacity="0.85"/>
  <!-- Pure White Clinical Droplet -->
  <path d="M 24 9 C 24 9 14.5 21 14.5 27.5 C 14.5 32.7 18.8 37 24 37 C 29.2 37 33.5 32.7 33.5 27.5 C 33.5 21 24 9 24 9 Z" fill="#ffffff"/>
  <!-- Precision Clinical Cross -->
  <path d="M 22.2 20.5 L 25.8 20.5 L 25.8 24.5 L 29.8 24.5 L 29.8 28.1 L 25.8 28.1 L 25.8 32.1 L 22.2 32.1 L 22.2 28.1 L 18.2 28.1 L 18.2 24.5 L 22.2 24.5 Z" fill="url(#markGrad)"/>
  <!-- Micro Light Accent -->
  <circle cx="20.5" cy="18" r="1.3" fill="#ffffff"/>
  <circle cx="28.5" cy="32" r="1" fill="url(#goldMark)"/>
</svg>
