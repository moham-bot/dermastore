{% if products %}
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for product in products %}
      {% include "store/partials/product_card.html" %}
    {% endfor %}
  </div>
{% else %}
  <div class="p-16 text-center card">
    <div class="text-6xl mb-3">🔍</div>
    <h3 class="font-bold text-lg mb-1">لم يتم العثور على منتجات مطابقة</h3>
    <p class="text-xs opacity-60 mb-4">جرّب تقليل الفلاتر أو البحث بكلمات أخرى.</p>
    <a href="{% url 'store:products' %}" class="btn-primary text-xs">إعادة ضبط جميع الفلاتر</a>
  </div>
{% endif %}
